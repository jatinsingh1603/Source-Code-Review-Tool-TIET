# Ground truth of the KavachBank fixture (E13-01). Paths are relative to fixtures/kavachbank;
# lines are 1-based. Secrets and personal data are named by value_ref, never written here: a
# value_ref is a constant of tests/support/synthetic.py or "<kind>:<subtype>[:<index>]".
# Load it with tests/support/kavachbank.py; regenerate terms.txt with tools/gen_terms.py.
schema_version: 1

application:
  name: KavachBank
  description: >-
    A deliberately vulnerable retail-banking sample: savings and deposit accounts, fee and
    interest engines, loan scoring and fraud rules behind a Python API and a Node web front end.
  services:
    - services/api
    - services/web

planted_vulnerabilities:
  - {id: KB-VULN-001, cwe: 89, class: sql_injection, file: services/api/accounts.py, line: 11, demo_1: true}
  - {id: KB-VULN-002, cwe: 78, class: command_injection, file: services/api/reports.py, line: 9, demo_1: true}
  - {id: KB-VULN-003, cwe: 22, class: path_traversal, file: services/web/exporter.js, line: 9, demo_1: true}
  - {id: KB-VULN-004, cwe: 918, class: ssrf, file: services/web/payments.js, line: 18, demo_1: true}
  - {id: KB-VULN-005, cwe: 502, class: insecure_deserialisation, file: services/api/serialisation.py, line: 14, demo_1: true}
  - {id: KB-VULN-006, cwe: 327, class: weak_cryptography, file: services/api/security.py, line: 15, demo_1: true}
