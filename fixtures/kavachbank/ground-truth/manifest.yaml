# Ground truth of the KavachBank fixture (E13-01). Paths are relative to fixtures/kavachbank;
# lines are 1-based. Secrets and personal data are named by value_ref, never written here: a
# value_ref is a constant of tests/support/synthetic.py or "<kind>:<subtype>[:<index>]".
# Load it with tests/support/kavachbank.py; regenerate terms.txt with tools/gen_terms.py.
schema_version: 1

application:
  name: KavachBank
  description: >-
    A deliberately vulnerable retail-banking sample: savings and deposit accounts, fee and
    interest engines, loan scoring and fraud rules behind a Python API and a Node web front end.
  services:
    - services/api
    - services/web

