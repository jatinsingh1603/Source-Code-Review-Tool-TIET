[framework_contracts]
"DllMain" = "windows"
"SetUp" = "gtest"
"TearDown" = "gtest"
"TestBody" = "gtest"
"WinMain" = "windows"
"begin" = "std"
"closeEvent" = "qt"
"end" = "std"
"event" = "qt"
"keyPressEvent" = "qt"
"main" = "cpp"
"mousePressEvent" = "qt"
"operator()" = "cpp"
"paintEvent" = "qt"
"run" = "qt"
"size" = "std"
"what" = "std"

[framework_decorators]


[well_known]
sources = [
    "argv", "cin", "fgets", "fread", "getenv", "getline", "gets", "ifstream", "read", "readAll",
    "recv", "scanf",
]
sinks = [
    "QProcess", "delete", "exec", "execl", "execv", "execvp", "fopen", "free", "malloc",
    "memcpy", "mktemp", "new", "ofstream", "open", "popen", "printf", "reinterpret_cast",
    "sprintf", "start", "strcat", "strcpy", "system",
]
sanitisers = [
    "at", "canonical", "realpath", "regex_match", "snprintf", "stoi", "strlcpy",
    "weakly_canonical",
]
conventional_instances = ["logger", "log", "app"]

[reflection]
name_argument = 0
attribute_calls = []

[dynamic_code]
calls = [
    "eval",
]
