[well_known]
# Names that mark a taint source, a sink or a sanitiser in Java code.
sources = [
    "getParameter", "getParameterValues", "getParameterMap", "getHeader", "getCookies",
    "getQueryString", "getRequestURI", "getInputStream", "getReader", "getenv", "getProperty",
    "readLine", "RequestParam", "PathVariable", "RequestBody", "RequestHeader", "args",
]
sinks = [
    "executeQuery", "executeUpdate", "execute", "prepareStatement", "createStatement",
    "createQuery", "createNativeQuery", "exec", "start", "getRuntime", "ProcessBuilder",
    "readObject", "readValue", "forName", "newInstance", "invoke", "sendRedirect", "write",
    "print", "println", "openConnection", "evaluate", "eval", "lookup", "loadClass",
]
sanitisers = [
    "escapeHtml4", "escapeHtml", "escapeJava", "escapeXml11", "forHtml", "forJavaScript",
    "forUriComponent", "encode", "sanitize", "setString", "setInt", "setLong", "matches",
    "normalize", "toRealPath", "getCanonicalPath", "isEqual", "checkArgument",
]
# Conventional names of a framework application object.
conventional_instances = ["logger", "log", "app", "context", "java", "javax", "jakarta"]

[reflection]
# Java reflection takes the member name as its first argument (getDeclaredField("name")). A string
# that equals a name this file defines is rewritten with the binding; one that names something
# this file does not define stays in clear and is counted.
name_argument = 0
attribute_calls = [
    "getDeclaredField", "getField", "getDeclaredMethod", "getMethod", "getDeclaredConstructor",
]

[dynamic_code]
# Calls that execute text the classifier cannot see: a file that calls one is marked.
calls = ["eval"]
