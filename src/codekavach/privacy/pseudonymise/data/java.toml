# Public-name allowlist for Java (E09-06). Read by codekavach.privacy.pseudonymise.allowlist.
#
# Source: compiled by hand from the maintainers' working knowledge of the Java SE class library
#   and of the third-party libraries named below, limited to the security-relevant surface that
#   the rule matchers and the triage model need to recognise (sources, sinks, sanitisers, crypto,
#   serialisation, HTTP, SQL, process and file APIs). No library source code was copied. Names are
#   listed by package, not exhaustively. The list has NOT yet been checked name by name against
#   the upstream documentation; that check is a follow-up before a client engagement relies on it.
# Generated: 2026-11-10 (first curated version; edit by issue, and bump the version below).
# Version: java-2026.11.10.1
#
# Reading rules (the classifier in codekavach.privacy.pseudonymise.classify):
#   * [packages."<a.b>"] lists the members of a package, keyed by the first two segments of the
#     import (java.sql, javax.crypto, org.springframework). A member is public when it is
#     accessed on a value known to come from that package (for example statement.executeQuery).
#   * A package of kind "third_party" is public as an import only when listed here. Packages of
#     the Java SE class library (java.*, javax.*) are public as imports by origin (E07-04), and
#     their members are listed so that chains through them stay recognisable. kind "builtin" is
#     java.lang, which needs no import.
#   * A name listed under several packages is public by name (the conservative reading).
#   * Every entry under [framework_contracts] and [framework_decorators] names its framework in
#     the value. Renaming these names changes behaviour as well as hiding the framework contract.
#   * Only the names here, the keywords and builtins of the language and the user's
#     public_allowlist_extra are ever public. Adding a name here is a disclosure decision.

version = "java-2026.11.10.1"
language = "java"

[packages.builtins]
kind = "builtin"
