"__sleep" = "php"
"__toString" = "php"
"__unserialize" = "php"
"__unset" = "php"
"__wakeup" = "php"
"authorize" = "laravel"
"boot" = "laravel"
"configure" = "symfony"
"count" = "php"
"create" = "laravel"
"current" = "php"
"destroy" = "laravel"
"down" = "laravel"
"edit" = "laravel"
"execute" = "symfony"
"getIterator" = "php"
"handle" = "laravel"
"index" = "laravel"
"jsonSerialize" = "php"
