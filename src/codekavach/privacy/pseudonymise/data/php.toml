"Route" = "symfony"

[well_known]
sources = [
    "_COOKIE", "_ENV", "_FILES", "_GET", "_POST", "_REQUEST", "_SERVER", "file_get_contents",
    "filter_input", "get", "getenv", "input", "post",
]
sinks = [
    "assert", "call_user_func", "curl_exec", "echo", "eval", "exec", "extract",
    "file_put_contents", "header", "include", "move_uploaded_file", "mysql_query",
    "mysqli_query", "passthru", "popen", "print", "proc_open", "query", "raw", "require",
    "selectRaw", "shell_exec", "system", "unlink", "unserialize", "whereRaw",
]
sanitisers = [
    "addslashes", "basename", "bindParam", "bindValue", "bind_param", "e", "escapeshellarg",
    "escapeshellcmd", "filter_var", "htmlentities", "htmlspecialchars", "intval",
    "mysqli_real_escape_string", "password_hash", "prepare", "quote", "real_escape_string",
    "realpath", "strip_tags",
]
conventional_instances = ["logger", "log", "app"]

[reflection]
name_argument = 0
attribute_calls = [
    "call_user_func", "call_user_func_array", "method_exists", "property_exists",
]

[dynamic_code]
calls = [
    "assert", "create_function", "eval",
]
