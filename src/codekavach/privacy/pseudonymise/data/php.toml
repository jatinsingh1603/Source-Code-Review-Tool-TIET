    "session", "session_destroy", "session_regenerate_id", "session_start", "setAttribute",
    "setcookie", "sha1", "shell_exec", "simplexml_load_string", "sort", "spl_autoload_register",
    "sprintf", "statement", "str_contains", "str_pad", "str_repeat", "str_replace",
    "str_starts_with", "strip_tags", "strlen", "strpos", "strrev", "strtolower", "strtotime",
    "strtoupper", "strval", "substr", "sys_get_temp_dir", "system", "table", "tempnam", "time",
