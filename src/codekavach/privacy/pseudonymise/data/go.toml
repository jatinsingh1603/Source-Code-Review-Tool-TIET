[packages."github.com/stretchr/testify"]
kind = "third_party"
members = [
    "assert", "require", "mock", "suite", "Equal", "NotEqual", "Nil", "NotNil", "True", "False",
    "NoError", "Error", "Contains", "Len", "Empty", "NotEmpty", "ElementsMatch", "Panics",
    "EqualError", "ErrorIs", "ErrorContains", "JSONEq", "Eventually", "FailNow", "Fail",
]

[framework_contracts]
# Interfaces are satisfied by method name, so these names are a contract with the standard
# library or a framework and are kept.
Error = "builtin"
String = "fmt"
GoString = "fmt"
Format = "fmt"
Unwrap = "errors"
Is = "errors"
As = "errors"
ServeHTTP = "net/http"
Read = "io"
Write = "io"
Close = "io"
Seek = "io"
ReadFrom = "io"
WriteTo = "io"
Len = "sort"
Less = "sort"
Swap = "sort"
Push = "container/heap"
Pop = "container/heap"
MarshalJSON = "encoding/json"
UnmarshalJSON = "encoding/json"
MarshalText = "encoding"
UnmarshalText = "encoding"
MarshalBinary = "encoding"
UnmarshalBinary = "encoding"
MarshalYAML = "yaml"
UnmarshalYAML = "yaml"
Scan = "database/sql"
Value = "database/sql/driver"
TableName = "gorm"
BeforeCreate = "gorm"
AfterCreate = "gorm"
BeforeSave = "gorm"
AfterSave = "gorm"
BeforeUpdate = "gorm"
AfterUpdate = "gorm"
BeforeDelete = "gorm"
AfterDelete = "gorm"
AfterFind = "gorm"
Done = "context"
Err = "context"
Deadline = "context"
Lock = "sync"
Unlock = "sync"
Next = "iterator"
main = "go"
init = "go"

[framework_decorators]

[well_known]
# Names that mark a taint source, a sink or a sanitiser in Go code.
sources = [
    "Args", "Getenv", "LookupEnv", "Environ", "FormValue", "PostFormValue", "ParseForm", "Query",
    "Param", "PostForm", "Cookie", "Cookies", "Header", "Body", "ReadAll", "ReadString", "Scan",
    "Text", "ReadLine", "Vars", "URL", "RemoteAddr", "FormFile", "BindJSON", "ShouldBindJSON",
]
sinks = [
    "Command", "CommandContext", "Exec", "ExecContext", "Query", "QueryContext", "QueryRow",
    "QueryRowContext", "Raw", "Sprintf", "Fprintf", "Redirect", "ServeFile", "Open", "OpenFile",
    "ReadFile", "WriteFile", "Create", "Remove", "RemoveAll", "Unmarshal", "Decode", "HTML",
    "JS", "URL", "Eval", "Write", "WriteString", "Println", "Printf", "Fatal", "Fatalf",
    "InsecureSkipVerify", "MustCompile", "Parse",
]
sanitisers = [
    "QueryEscape", "PathEscape", "HTMLEscapeString", "JSEscapeString", "EscapeText", "Clean",
    "Join", "Rel", "Base", "Abs", "EvalSymlinks", "QuoteMeta", "Quote", "Atoi", "ParseInt",
    "ConstantTimeCompare", "Equal", "CompareHashAndPassword", "MaxBytesReader", "Named",
]
# Conventional names of a framework application object.
conventional_instances = ["router", "mux", "engine"]

[reflection]
# Go reflection takes the field or method name as its first argument (FieldByName("Name")). A
# string that equals a name this file defines is rewritten with the binding; one that names
# something this file does not define stays in clear and is counted.
name_argument = 0
attribute_calls = ["FieldByName", "MethodByName", "FieldByNameFunc"]

[dynamic_code]
# Go has no call that executes source text; the list is empty on purpose.
calls = []
