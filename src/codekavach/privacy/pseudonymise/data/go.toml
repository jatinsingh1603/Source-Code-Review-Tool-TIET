# Public-name allowlist for Go (E09-06). Read by codekavach.privacy.pseudonymise.allowlist.
#
# Source: compiled by hand from the maintainers' working knowledge of the Go standard library and
#   of the third-party modules named below, limited to the security-relevant surface that the rule
#   matchers and the triage model need to recognise (sources, sinks, sanitisers, crypto,
#   serialisation, HTTP, SQL, process and file APIs). No library source code was copied. Names are
#   listed by package, not exhaustively. The list has NOT yet been checked name by name against
#   the upstream documentation; that check is a follow-up before a client engagement relies on it.
# Generated: 2026-11-10 (first curated version; edit by issue, and bump the version below).
# Version: go-2026.11.10.1
#
# Reading rules (the classifier in codekavach.privacy.pseudonymise.classify):
#   * [packages."<import path>"] lists the members of a package. A standard-library package is
#     keyed by its full import path (database/sql); a third-party module by host and the first
#     two path elements (github.com/gin-gonic/gin), or three for golang.org/x. A member is public
#     when it is accessed on a value known to come from that package (for example sql.Open).
#   * A package of kind "third_party" is public as an import only when listed here. Standard
#     library packages are public as imports by origin (E07-04), and their members are listed so
#     that chains through them stay recognisable. kind "builtin" is the universe scope.
#   * A name listed under several packages is public by name (the conservative reading).
#   * Every entry under [framework_contracts] names its framework in the value. Renaming these
#     names changes behaviour: Go matches interfaces by method name.
#   * Exported and unexported names of the project are both renamed: export is visibility, not
#     public API. Only the names here, the keywords and builtins of the language and the user's
#     public_allowlist_extra are ever public. Adding a name here is a disclosure decision.

version = "go-2026.11.10.1"
language = "go"

[packages.builtins]
kind = "builtin"
# The universe scope: predeclared functions, types and constants, and the error interface.
members = [
    "append", "cap", "clear", "close", "complex", "copy", "delete", "imag", "len", "make", "max",
    "min", "new", "panic", "print", "println", "real", "recover", "bool", "byte", "complex64",
    "complex128", "error", "float32", "float64", "int", "int8", "int16", "int32", "int64", "rune",
    "string", "uint", "uint8", "uint16", "uint32", "uint64", "uintptr", "any", "comparable",
    "true", "false", "iota", "nil", "Error",
]

