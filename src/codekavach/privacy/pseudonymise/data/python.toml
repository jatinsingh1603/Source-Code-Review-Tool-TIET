# Public-name allowlist for Python (E09-02). Read by codekavach.privacy.pseudonymise.allowlist.
#
# Source: compiled by hand from the maintainers' working knowledge of each package and of the
#   Python 3.12 standard library, limited to the security-relevant surface that the rule matchers
#   and the triage model need to recognise (sources, sinks, sanitisers, crypto, serialisation, HTTP,
#   SQL). No package source code was copied. Names are listed by package, not exhaustively. The
#   list has NOT yet been checked name by name against the upstream documentation; that check is
#   a follow-up before a client engagement relies on it.
# Generated: 2026-11-06 (first curated version; edit by issue, and bump the version below).
# Version: python-2026.11.06.1
#
# Reading rules (the classifier in codekavach.privacy.pseudonymise.classify):
#   * [packages.<name>] lists the members of a package. A member is public when it is accessed
#     on a value that is known to come from that package (for example request.args.get).
#   * A package with kind "third_party" is public as an import only when listed here. kind
#     "stdlib" packages are public as imports by origin (E07-04), and their members are listed
#     here so that chains through them stay recognisable. kind "pseudo" is a shared API that is
#     not a module (PEP 249 cursors). kind "builtin" is the language's built-in namespace.
#   * Member names are not sealed to one package: a name listed under several packages is public
#     by name, which is the conservative reading for a name that a provider may already know.
#   * Every entry under [framework_contracts] and [framework_decorators] names its framework in
#     the comment above it. Renaming these names changes behaviour as well as hiding the
#     framework contract, so they are kept.
#   * The receiver of a method (`self`, `cls`) is not listed here: it is public by position, by the
#     classifier rule `receiver` (first parameter of a non-static function in a class body).
#   * Only the names here, the keywords and builtins of the language, dunder names and the
#     user's public_allowlist_extra are ever public. Adding a name here is a disclosure decision.

version = "python-2026.11.06.1"
language = "python"

[packages.builtins]
kind = "builtin"
# Keyword arguments of common built-in functions (open, sorted, print, int, max) and the methods
# of built-in types a reviewer reads without a binding (dict.get, str.join, list.append).
members = [
    "mode", "encoding", "errors", "newline", "buffering", "key", "reverse", "default", "sep",
    "end", "file", "flush", "base", "start", "get", "items", "keys", "values", "join", "split",
    "strip", "lower", "upper", "format", "append", "extend", "encode", "decode", "read", "write",
    "close", "replace", "startswith", "endswith", "update", "pop",
]

[packages.dbapi]
kind = "pseudo"
# PEP 249 (Database API 2.0) cursor and connection surface shared by sqlite3, psycopg2, pymysql,
# SQLAlchemy's DBAPI layer and every other DB-API driver. Not an importable module.
members = [
    "execute", "executemany", "executescript", "fetchone", "fetchall", "fetchmany", "callproc",
    "cursor", "commit", "rollback", "close", "params", "description", "rowcount", "lastrowid",
    "arraysize", "connection", "connect", "nextset", "setinputsizes", "paramstyle",
]

