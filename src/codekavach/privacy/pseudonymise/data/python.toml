[framework_contracts]
# Django and Flask-style views, DRF viewsets and APIView: the HTTP handler names of a view.
get = "flask,django,rest_framework"
post = "flask,django,rest_framework"
put = "flask,django,rest_framework"
delete = "flask,django,rest_framework"
patch = "flask,django,rest_framework"
head = "django,rest_framework"
options = "django,rest_framework"
dispatch = "django,rest_framework"
handle = "django,rest_framework"
# DRF viewset actions and serializer hooks.
list = "rest_framework"
retrieve = "rest_framework"
create = "rest_framework"
update = "rest_framework"
partial_update = "rest_framework"
destroy = "rest_framework"
perform_create = "rest_framework"
perform_update = "rest_framework"
get_queryset = "django,rest_framework"
to_representation = "rest_framework"
to_internal_value = "rest_framework"
validate_empty_values = "rest_framework"
# Django model and form lifecycle.
save = "django"
clean = "django"
clean_fields = "django"
full_clean = "django"
validate = "django,marshmallow,pydantic"
form_valid = "django"
form_invalid = "django"
get_context_data = "django"
get_object = "django,rest_framework"
# Django middleware hooks.
process_request = "django"
process_response = "django"
process_view = "django"
process_exception = "django"
# Serialisers, deserialisers and resource hooks.
serialize = "marshmallow,pydantic"
deserialize = "marshmallow"
# unittest lifecycle hooks.
setUp = "unittest"
tearDown = "unittest"

[framework_decorators]
# Flask application and blueprint routing decorators: the entry points of a web handler.
route = "flask"
before_request = "flask"
after_request = "flask"
errorhandler = "flask"
# Django REST Framework decorators on view functions.
api_view = "rest_framework"
action = "rest_framework"
permission_classes = "rest_framework"
authentication_classes = "rest_framework"
# Pydantic and marshmallow validators.
field_validator = "pydantic"
model_validator = "pydantic"
validator = "pydantic"
validates = "marshmallow"
post_load = "marshmallow"
# Standard-library and common decorators with a security meaning.
login_required = "django"
csrf_exempt = "django"
staticmethod = "python"
classmethod = "python"
property = "python"
dataclass = "dataclasses"
lru_cache = "functools"

[well_known]
# Names that mark a taint source, a sink or a sanitiser in Python code, and the conventional
# name of a web application object. Kept because a reviewer and the triage model need them.
sources = [
    "input", "argv", "environ", "stdin", "getenv", "request", "GET", "POST", "FILES", "COOKIES",
    "headers", "args", "form", "json", "cookies", "files", "query_params", "body",
]
sinks = [
    "eval", "exec", "system", "popen", "execute", "executemany", "executescript", "run", "call",
    "check_output", "Popen", "open", "write", "send", "redirect", "render_template_string",
    "loads", "load", "unsafe_load", "mark_safe", "raw", "extra", "send_file",
]
sanitisers = [
    "escape", "quote", "escape_string", "clean", "sanitize", "sanitise", "mark_safe",
    "strip_tags", "urlencode", "html", "bleach", "markupsafe", "secure_filename",
]
# Conventional names of a framework application object (Flask: app = Flask(__name__)).
conventional_instances = ["app", "application", "blueprint", "router"]

[reflection]
# Calls that take an attribute name as a string argument (the string is an identifier in
# disguise). The second argument is the name.
attribute_calls = ["getattr", "setattr", "hasattr", "delattr"]

[dynamic_code]
# Calls that execute text the classifier cannot see: a file that calls one is opaque to renaming.
calls = ["eval", "exec", "compile", "__import__"]
