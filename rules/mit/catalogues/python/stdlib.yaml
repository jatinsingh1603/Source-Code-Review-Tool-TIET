  - {id: python.sink.path.shutil-copy, symbol: shutil.copy, arg: 0, context: path}
  - {id: python.sink.http.urlopen, symbol: urllib.request.urlopen, arg: 0, context: url}
  - {id: python.sink.http.requests-get, symbol: requests.get, arg: 0, context: url}
  - {id: python.sink.http.requests-post, symbol: requests.post, arg: 0, context: url}
