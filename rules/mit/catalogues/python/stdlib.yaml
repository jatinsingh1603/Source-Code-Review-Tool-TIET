  - {id: python.sink.shell.subprocess.popen, symbol: subprocess.Popen, arg: 0, context: shell}
  - {id: python.sink.shell.subprocess.check-output, symbol: subprocess.check_output, arg: 0, context: shell}
  - {id: python.sink.shell.subprocess.check-call, symbol: subprocess.check_call, arg: 0, context: shell}
  - {id: python.sink.code.eval, symbol: builtins.eval, arg: 0}
