id: python.stdlib
language: python
framework: stdlib
sources:
  - {id: python.source.input, type: cli, symbol: builtins.input}
  - {id: python.source.argv, type: cli, symbol: sys.argv}
  - {id: python.source.environ, type: environment, symbol: os.environ}
sinks:
