  - {id: python.sanitiser.path-basename, symbol: os.path.basename, covers: [path]}
  - {id: python.sanitiser.bleach-clean, symbol: bleach.clean, covers: [html]}
  - {id: python.sanitiser.strip-tags, symbol: django.utils.html.strip_tags, covers: [html]}
