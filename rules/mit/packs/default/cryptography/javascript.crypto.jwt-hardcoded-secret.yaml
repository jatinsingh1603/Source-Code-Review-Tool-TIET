id: javascript.crypto.jwt-hardcoded-secret
languages:
- javascript
message: JSON web token signed or verified with a secret written in the source
severity: high
confidence: medium
metadata:
  cwe:
  - 321
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Load the signing key from a secret store or the environment and rotate it.
  added_in: 1.0.0
match:
  any:
  - pattern: $J.sign($P, $K, ...)
    where:
    - metavariable: $K
      kind: literal
  - pattern: $J.verify($T, $K, ...)
    where:
    - metavariable: $K
      kind: literal
