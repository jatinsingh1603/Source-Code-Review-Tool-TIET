id: javascript.crypto.weak-hash
languages:
- javascript
message: MD5 or SHA-1 used as a hash
severity: medium
confidence: high
metadata:
  cwe:
  - 327
  - 328
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use SHA-256 or better; for passwords use scrypt, bcrypt or argon2.
  added_in: 1.0.0
match:
  any:
  - pattern: $C.createHash("md5")
  - pattern: $C.createHash("sha1")
