id: ruby.crypto.weak-hash
languages:
- ruby
message: MD5 or SHA-1 used as a hash
severity: medium
confidence: medium
metadata:
  cwe:
  - 327
  - 328
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use Digest::SHA256 or better; for passwords use bcrypt or argon2.
  added_in: 1.0.0
match:
  any:
  - pattern: Digest::MD5.$M(...)
  - pattern: Digest::SHA1.$M(...)
  - pattern: OpenSSL::Digest::MD5.$M(...)
  - pattern: OpenSSL::Digest::SHA1.$M(...)
  - pattern: OpenSSL::Digest.new("MD5")
  - pattern: OpenSSL::Digest.new("SHA1")
