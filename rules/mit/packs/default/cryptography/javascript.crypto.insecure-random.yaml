id: javascript.crypto.insecure-random
languages:
- javascript
message: Math.random used where a secret or token is made
severity: medium
confidence: medium
metadata:
  cwe:
  - 338
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use crypto.randomBytes or crypto.randomUUID for tokens, keys and codes.
  added_in: 1.0.0
match:
  any:
  - pattern: Math.random()
  all:
  - pattern_inside: function $FN(...) { ... }
    where:
    - metavariable: $FN
      regex: (?i)(token|secret|password|otp|nonce|salt|session|csrf|api_?key)
