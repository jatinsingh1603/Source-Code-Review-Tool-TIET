id: python.crypto.weak-hash
languages:
- python
message: MD5 or SHA-1 used as a hash
severity: medium
confidence: medium
metadata:
  cwe:
  - 327
  - 328
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use SHA-256 or better; for passwords use scrypt, bcrypt or argon2.
  added_in: 1.0.0
match:
  any:
  - pattern: $F($...A)
    where:
    - metavariable: $F
      catalogue: python.sink.weakhash.*
  none:
  - pattern: $F(..., usedforsecurity=False, ...)
