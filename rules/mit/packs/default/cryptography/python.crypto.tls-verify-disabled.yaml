id: python.crypto.tls-verify-disabled
languages:
- python
message: Certificate verification switched off
severity: high
confidence: high
metadata:
  cwe:
  - 295
  owasp:
  - A07:2021
  licence: MIT
  source: CodeKavach original
  remediation: Leave verification on; to trust a private CA point verify at the CA bundle.
  added_in: 1.0.0
match:
  any:
  - pattern: $F(..., verify=False, ...)
    where:
    - metavariable: $F
      catalogue: python.sink.http.*
  - pattern: ssl._create_unverified_context(...)
  - pattern: $X.check_hostname = False
  - pattern: $X.verify_mode = ssl.CERT_NONE
