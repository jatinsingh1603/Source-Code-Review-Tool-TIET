id: php.crypto.weak-hash
languages:
- php
message: MD5 or SHA-1 used as a hash
severity: medium
confidence: medium
metadata:
  cwe:
  - 327
  - 328
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use hash('sha256', ...) or better; for passwords use password_hash.
  added_in: 1.0.0
match:
  any:
  - pattern: md5($X, ...)
  - pattern: sha1($X, ...)
  - pattern: hash("md5", $X, ...)
  - pattern: hash("sha1", $X, ...)
