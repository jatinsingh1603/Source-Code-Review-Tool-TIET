id: c.crypto.insecure-random
languages:
- c
- cpp
message: rand or random used where a secret or token is made
severity: medium
confidence: medium
metadata:
  cwe:
  - 338
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Read from the operating system source (getrandom, arc4random, /dev/urandom).
  added_in: 1.0.0
match:
  any:
  - pattern: rand()
  - pattern: random()
  all:
  - pattern_inside: $T $FN(...) { ...; }
    where:
    - metavariable: $FN
      regex: (?i)(token|secret|password|otp|nonce|salt|session|key)
