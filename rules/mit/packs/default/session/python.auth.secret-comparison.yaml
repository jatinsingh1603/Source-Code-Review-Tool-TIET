id: python.auth.secret-comparison
languages:
- python
message: Secret compared with == instead of a constant-time comparison
severity: medium
confidence: low
metadata:
  cwe:
  - 208
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use hmac.compare_digest for tokens, signatures and password hashes.
  added_in: 1.0.0
match:
  any:
  - pattern: $A == $B
    where:
    - metavariable: $A
      regex: (?i)(password|passwd|secret|api_?key|token|hmac|signature|digest)
    - metavariable: $B
      is_constant: false
  - pattern: $A == $B
    where:
    - metavariable: $B
      regex: (?i)(password|passwd|secret|api_?key|token|hmac|signature|digest)
    - metavariable: $A
      is_constant: false
