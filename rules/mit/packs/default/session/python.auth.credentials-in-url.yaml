id: python.auth.credentials-in-url
languages:
- python
message: Credential or token placed in a URL query string
severity: medium
confidence: medium
metadata:
  cwe:
  - 598
  owasp:
  - A02:2021
  licence: MIT
  source: CodeKavach original
  remediation: Send secrets in a header or the request body; URLs end up in logs and referrers.
  added_in: 1.0.0
match:
  any:
  - pattern: $F($U, ...)
    where:
    - metavariable: $F
      catalogue: python.sink.http.*
    - metavariable: $U
      regex: '[?&](password|passwd|pwd|token|api_?key|secret|access_token)='
