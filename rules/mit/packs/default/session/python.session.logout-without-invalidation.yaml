id: python.session.logout-without-invalidation
languages:
- python
message: Logout handler that does not visibly end the session
severity: medium
confidence: low
metadata:
  cwe:
  - 613
  owasp:
  - A07:2021
  licence: MIT
  source: CodeKavach original
  remediation: Clear or rotate the server-side session on logout (session.clear(), logout_user()).
  added_in: 1.0.0
match:
  any:
  - pattern: 'def logout(...): ...'
  none:
  - pattern: "def logout(...):\n    ...\n    session.clear()\n    ..."
  - pattern: "def logout(...):\n    ...\n    logout_user()\n    ..."
  - pattern: "def logout(...):\n    ...\n    auth_logout(...)\n    ..."
  - pattern: "def logout(...):\n    ...\n    $S.flush()\n    ..."
