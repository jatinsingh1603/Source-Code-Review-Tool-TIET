id: python.injection.subprocess-shell
languages:
- python
message: Command with shell=True built from variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 78
  owasp:
  - A03:2021
  capec:
  - 88
  licence: MIT
  source: CodeKavach original
  remediation: Pass an argument list and leave shell off, or quote every part with shlex.quote.
  added_in: 1.0.0
match:
  any:
  - pattern: $F($X, ..., shell=True, ...)
    where:
    - metavariable: $F
      catalogue: python.sink.shell.subprocess.*
    - metavariable: $X
      kind: dynamic_string
    - metavariable: $X
      not_regex: shlex\.quote
  - pattern: $F($X, ..., shell=True, ...)
    where:
    - metavariable: $F
      catalogue: python.sink.shell.subprocess.*
    - metavariable: $X
      kind: request_derived
    - metavariable: $X
      not_regex: shlex\.quote
