id: python.injection.os-command
languages:
- python
message: Shell command built from variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 78
  owasp:
  - A03:2021
  capec:
  - 88
  licence: MIT
  source: CodeKavach original
  remediation: Pass an argument list to subprocess without a shell, or quote every part with shlex.quote.
  added_in: 1.0.0
match:
  any:
  - pattern: $F($X)
    where:
    - metavariable: $F
      catalogue: python.sink.shell.os.*
    - metavariable: $X
      kind: dynamic_string
    - metavariable: $X
      not_regex: shlex\.quote
  - pattern: $F($X)
    where:
    - metavariable: $F
      catalogue: python.sink.shell.os.*
    - metavariable: $X
      kind: request_derived
    - metavariable: $X
      not_regex: shlex\.quote
