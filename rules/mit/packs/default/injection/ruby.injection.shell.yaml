id: ruby.injection.shell
languages:
- ruby
message: Shell command built from variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 78
  owasp:
  - A03:2021
  capec:
  - 88
  licence: MIT
  source: CodeKavach original
  remediation: Pass the command and its arguments separately (system('git', 'log', arg)) or quote with Shellwords.escape.
  added_in: 1.0.0
match:
  any:
          - pattern: "system($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "system($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "exec($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "exec($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "Kernel.system($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "Kernel.system($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "IO.popen($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "IO.popen($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "Open3.capture2($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "Open3.capture2($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "Open3.capture3($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "Open3.capture3($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived
