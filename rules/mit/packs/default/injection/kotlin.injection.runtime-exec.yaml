id: kotlin.injection.runtime-exec
languages:
- kotlin
message: Operating system command built from variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 78
  owasp:
  - A03:2021
  capec:
  - 88
  licence: MIT
  source: CodeKavach original
  remediation: Pass the executable and arguments as a list to ProcessBuilder and never through a shell string.
  added_in: 1.0.0
match:
  any:
          - pattern: "Runtime.getRuntime().exec($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "Runtime.getRuntime().exec($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived

          - pattern: "ProcessBuilder($X, ...)"
            where:
            - metavariable: $X
              kind: dynamic_string
          - pattern: "ProcessBuilder($X, ...)"
            where:
            - metavariable: $X
              kind: request_derived
