id: php.injection.shell-exec
languages:
- php
message: Shell command built from variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 78
  owasp:
  - A03:2021
  capec:
  - 88
  licence: MIT
  source: CodeKavach original
  remediation: Pass a fixed command and quote every argument with escapeshellarg, or avoid the shell.
  added_in: 1.0.0
match:
  any:
  - pattern: $F($X, ...)
    where:
    - metavariable: $F
      catalogue: php.sink.shell.*
    - metavariable: $X
      kind: dynamic_string
  - pattern: $F($X, ...)
    where:
    - metavariable: $F
      catalogue: php.sink.shell.*
    - metavariable: $X
      kind: request_derived
