id: javascript.injection.eval
languages:
- javascript
message: eval, Function or vm on variable data
severity: high
confidence: medium
metadata:
  cwe:
  - 95
  owasp:
  - A03:2021
  licence: MIT
  source: CodeKavach original
  remediation: Do not evaluate text from outside; parse the format (JSON.parse) instead.
  added_in: 1.0.0
match:
  any:
  - pattern: eval($X)
    where:
    - metavariable: $X
      kind: dynamic_string
  - pattern: eval($X)
    where:
    - metavariable: $X
      kind: request_derived
  - pattern: new Function($...A)
    where:
    - metavariable: $...A
      kind: dynamic_string
  - pattern: $F($X, ...)
    where:
    - metavariable: $F
      catalogue: javascript.sink.code.vm.*
    - metavariable: $X
      is_constant: false
  - pattern: setTimeout($X, ...)
    where:
    - metavariable: $X
      kind: dynamic_string
