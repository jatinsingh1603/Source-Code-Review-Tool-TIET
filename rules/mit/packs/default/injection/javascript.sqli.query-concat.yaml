id: javascript.sqli.query-concat
languages:
- javascript
message: SQL query built by string concatenation or a template literal
severity: high
confidence: medium
metadata:
  cwe:
  - 89
  owasp:
  - A03:2021
  asvs:
  - 5.3.4
  capec:
  - 66
  licence: MIT
  source: CodeKavach original
  remediation: Use placeholders and pass values as parameters.
  added_in: 1.0.0
match:
  any:
  - pattern: $DB.query($Q, ...)
    where:
    - metavariable: $Q
      kind: dynamic_string
  - pattern: $DB.execute($Q, ...)
    where:
    - metavariable: $Q
      kind: dynamic_string
  - pattern: $DB.raw($Q, ...)
    where:
    - metavariable: $Q
      kind: dynamic_string
  none:
  - pattern: $DB.query($Q, $P)
  - pattern: $DB.execute($Q, $P)
