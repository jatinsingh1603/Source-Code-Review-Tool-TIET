id: python.mass-assignment.request-splat
languages:
- python
message: Model built or updated from a whole request document
severity: medium
confidence: medium
metadata:
  cwe:
  - 915
  owasp:
  - A04:2021
  licence: MIT
  source: CodeKavach original
  remediation: Copy only the fields the caller may set, or validate with a schema.
  added_in: 1.0.0
match:
  any:
  - pattern: $F(**$X)
    where:
    - metavariable: $X
      regex: \brequest\.(json|form|get_json|POST|data|values)
