id: c.race.temp-file-name
languages:
- c
- cpp
message: mktemp, tmpnam and tempnam return a name that another process can claim first
severity: medium
confidence: high
metadata:
  cwe:
  - 377
  owasp:
  - A01:2021
  licence: MIT
  source: CodeKavach original
  remediation: Use mkstemp, which creates the file atomically.
  added_in: 1.0.0
match:
  any:
  - pattern: mktemp($T)
  - pattern: tmpnam($T)
  - pattern: tempnam($D, $P)
