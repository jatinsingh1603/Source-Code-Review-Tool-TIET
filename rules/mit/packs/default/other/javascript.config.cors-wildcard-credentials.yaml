id: javascript.config.cors-wildcard-credentials
languages:
- javascript
message: CORS allows any origin or reflects the origin while sending credentials
severity: medium
confidence: medium
metadata:
  cwe:
  - 942
  owasp:
  - A05:2021
  licence: MIT
  source: CodeKavach original
  remediation: List the allowed origins explicitly; never combine a wildcard with credentials.
  added_in: 1.0.0
match:
  any:
  - pattern: 'cors({ ..., origin: "*", ..., credentials: true, ... })'
  - pattern: 'cors({ ..., credentials: true, ..., origin: "*", ... })'
  - pattern: 'cors({ ..., origin: true, ..., credentials: true, ... })'
