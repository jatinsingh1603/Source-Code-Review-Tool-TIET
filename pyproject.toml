[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codekavach"
version = "0.1.0.dev0"
description = "Privacy-preserving, LLM-assisted secure source code review"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeKavach contributors" }]
keywords = ["security", "static-analysis", "code-review", "privacy", "llm", "sast"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Typing :: Typed",
]
dependencies = ["typer>=0.27", "rich>=15.0", "pydantic>=2.9,<3", "pydantic-settings>=2.3", "structlog>=24.4", "platformdirs>=4.2"]

[project.optional-dependencies]
# Reserved names. Later epics fill them; do not invent other extra names without an ADR.
server = []      # E32: fastapi, uvicorn, sqlalchemy, alembic, postgres driver
reports = []     # E31: weasyprint, docxtpl, xlsxwriter
providers = []   # E22: provider SDKs and LiteLLM
pii = []         # E08: PII detection models
eval = []        # E36/E37: dataset and metrics tooling

[project.scripts]
codekavach = "codekavach.cli.app:main"

[dependency-groups]
lint = ["ruff>=0.16", "import-linter"]
typecheck = ["mypy>=2.3", "types-PyYAML", "types-jsonschema"]
test = ["pytest>=9.1", "hypothesis", "pyyaml", "keyring", "pytest-cov", "coverage[toml]", "pytest-xdist", "pytest-randomly", "pytest-timeout", "pytest-socket", "jsonschema"]
hooks = ["pre-commit", "detect-secrets"]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
  { include-group = "hooks" },
]

[tool.uv]
required-version = ">=0.5"

[tool.hatch.build.targets.wheel]
packages = ["src/codekavach"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

# Ignore policy: `# type: ignore[code]  # reason` only; ignore-without-code enforces the
# code. There is no global ignore_missing_imports. For an untyped third-party package,
# prefer a types-* stub package in the typecheck group; otherwise add a named override
# below with a comment naming the issue that introduced it. Never set ignore_errors.
# Any in a public signature in codekavach.privacy or codekavach.llm needs a
# justification comment.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
explicit_package_bases = true
files = ["src/codekavach", "tests", "tools"]
exclude = ["^fixtures/", "^build/", "^dist/", "^ui/", "^extensions/", '^tests/typing/fail_.*\.py$']
show_error_codes = true
pretty = true

# Overrides for untyped third-party packages. Example:
# [[tool.mypy.overrides]]
# module = ["some_untyped_pkg", "some_untyped_pkg.*"]   # added by E15-xx: engine wrapper without stubs
# ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not network", "--disable-socket", "--allow-unix-socket"]
xfail_strict = true
timeout = 120
filterwarnings = [
  "error",
  # pytest-socket warns before raising its blocking error; the error is what tests assert on.
  "ignore:A test tried to use socket:UserWarning",
]
markers = [
  "unit: fast, in-process, no subprocess except the interpreter itself, no network",
  "integration: several modules together, real filesystem, subprocess of our own CLI allowed",
  "e2e: full codekavach runs against fixtures",
  "privacy: invariant tests I1 to I6, property-based where possible",
  "slow: takes more than about two seconds",
  "perf: performance budget test; part of the default run; limits scale with CODEKAVACH_PERF_FACTOR; macOS CI cells deselect it",
  "network: needs external network; deselected by default and never run in CI",
  "requires_engine(name): needs an external analysis engine on PATH; skipped when absent",
]

[tool.coverage.run]
source_pkgs = ["codekavach"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.paths]
source = ["src/codekavach", "*/site-packages/codekavach"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", '^\s*\.\.\.$']

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["fixtures", "ui", "extensions", "action", "deploy"]

# Rule families and why they are selected:
#   E, W, F        pycodestyle and pyflakes
#   I              import sorting
#   N              naming
#   UP             modern syntax for Python 3.12
#   B A C4 SIM RET PIE PERF  common bug and simplification checks
#   PTH            pathlib instead of os.path
#   DTZ            timezone-aware datetimes (ledger timestamps)
#   T20            no print(): output goes through Rich consoles or the logger
#   BLE            no blind except: protects fail-closed behaviour (invariant I4)
#   S              flake8-bandit security checks
#   G LOG          logging hygiene: no f-strings in log calls
#   TID            banned imports and APIs (the list itself is added by E01-14)
#   D              docstrings, Google convention
#   PGH RUF PL     pygrep hooks, ruff-specific rules, pylint
#
# noqa policy: always name the rule code and give a reason on the same line,
# for example `# noqa: BLE001 - fail closed: any error must abort the send`.
# A bare `# noqa` is rejected by PGH004. COM812 and ISC001 stay off because they
# conflict with the formatter. When ruff renames or stabilises rules, update the
# selection in a dedicated commit; never silence a warning by removing a family.
[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "N",
  "UP",
  "B", "A", "C4", "SIM", "RET", "PIE", "PERF",
  "PTH",
  "DTZ",
  "T20",
  "BLE",
  "S",
  "G", "LOG",
  "TID",
  "D",
  "PGH", "RUF",
  "PL",
]
ignore = [
  "A005",     # architecture mandates package names such as analysis.secrets and eval
  "D105", "D107",
  "PLR0913",  # argument count is reviewed by humans, not by a fixed number
  "PLR2004",
  "S603",     # subprocess without shell is our engine-adapter model (ADR-0002); S602 and S604 to S607 stay on
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "D", "PLR2004", "N802", "TID251"]
"tools/**" = ["T20", "D"]            # project tooling (ARCHITECTURE section 3): stand-alone scripts may print
"src/codekavach/cli/**" = ["B008"]   # Typer uses function calls as argument defaults
"tests/typing/*" = ["F841", "B018"]  # typing case files hold deliberately unused names and expressions
"src/codekavach/core/log/**" = ["TID251"]  # the only place that creates loggers (ADR-0005)
"src/codekavach/privacy/egress/transport.py" = ["TID251"]
"src/codekavach/privacy/egress/transport/**" = ["TID251"]

# I1 (ADR-0003): network modules that import-linter cannot distinguish, because it squashes
# external packages to their top-level name (urllib.parse must stay allowed). Contracts for
# third-party client packages live in .importlinter.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request".msg = "I1: network access only in codekavach.privacy.egress.transport (ADR-0003)"
"http.client".msg = "I1: network access only in codekavach.privacy.egress.transport (ADR-0003)"
"socket".msg = "I1: network access only in codekavach.privacy.egress.transport (ADR-0003)"
"ssl".msg = "I1: network access only in codekavach.privacy.egress.transport (ADR-0003)"
"ftplib".msg = "I1: no outbound connections outside the egress transport (ADR-0003)"
"smtplib".msg = "I1: no outbound connections outside the egress transport (ADR-0003)"
"xmlrpc.client".msg = "I1: no outbound connections outside the egress transport (ADR-0003)"
"google.genai".msg = "I1: vendor SDKs only behind the egress transport (ADR-0003)"
"google.generativeai".msg = "I1: vendor SDKs only behind the egress transport (ADR-0003)"
"google.cloud".msg = "I1: vendor SDKs only behind the egress transport (ADR-0003)"
"azure".msg = "I1: vendor SDKs only behind the egress transport (ADR-0003)"
"logging.getLogger".msg = "use codekavach.core.log.get_logger (ADR-0005)"
"structlog.get_logger".msg = "use codekavach.core.log.get_logger (ADR-0005)"
"asyncio.open_connection".msg = "I1: network access only in codekavach.privacy.egress.transport (ADR-0003)"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["codekavach"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
# Code blocks in Markdown are illustrative and docs/ARCHITECTURE.md is normative;
# the formatter must not rewrite them.
exclude = ["*.md"]
