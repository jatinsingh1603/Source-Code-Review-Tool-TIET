[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codekavach"
version = "0.1.0.dev0"
description = "Privacy-preserving, LLM-assisted secure source code review"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeKavach contributors" }]
keywords = ["security", "static-analysis", "code-review", "privacy", "llm", "sast"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Typing :: Typed",
]
dependencies = ["typer>=0.27", "rich>=15.0"]

[project.optional-dependencies]
# Reserved names. Later epics fill them; do not invent other extra names without an ADR.
server = []      # E32: fastapi, uvicorn, sqlalchemy, alembic, postgres driver
reports = []     # E31: weasyprint, docxtpl, xlsxwriter
providers = []   # E22: provider SDKs and LiteLLM
pii = []         # E08: PII detection models
eval = []        # E36/E37: dataset and metrics tooling

[project.scripts]
codekavach = "codekavach.cli.app:main"

[dependency-groups]
lint = ["ruff>=0.16"]
typecheck = ["mypy>=2.3"]
test = ["pytest>=9.1"]
dev = [{ include-group = "lint" }, { include-group = "typecheck" }, { include-group = "test" }]

[tool.uv]
required-version = ">=0.5"

[tool.hatch.build.targets.wheel]
packages = ["src/codekavach"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["fixtures", "ui", "extensions", "action", "deploy"]

# Rule families and why they are selected:
#   E, W, F        pycodestyle and pyflakes
#   I              import sorting
#   N              naming
#   UP             modern syntax for Python 3.12
#   B A C4 SIM RET PIE PERF  common bug and simplification checks
#   PTH            pathlib instead of os.path
#   DTZ            timezone-aware datetimes (ledger timestamps)
#   T20            no print(): output goes through Rich consoles or the logger
#   BLE            no blind except: protects fail-closed behaviour (invariant I4)
#   S              flake8-bandit security checks
#   G LOG          logging hygiene: no f-strings in log calls
#   TID            banned imports and APIs (the list itself is added by E01-14)
#   D              docstrings, Google convention
#   PGH RUF PL     pygrep hooks, ruff-specific rules, pylint
#
# noqa policy: always name the rule code and give a reason on the same line,
# for example `# noqa: BLE001 - fail closed: any error must abort the send`.
# A bare `# noqa` is rejected by PGH004. COM812 and ISC001 stay off because they
# conflict with the formatter. When ruff renames or stabilises rules, update the
# selection in a dedicated commit; never silence a warning by removing a family.
[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "N",
  "UP",
  "B", "A", "C4", "SIM", "RET", "PIE", "PERF",
  "PTH",
  "DTZ",
  "T20",
  "BLE",
  "S",
  "G", "LOG",
  "TID",
  "D",
  "PGH", "RUF",
  "PL",
]
ignore = [
  "A005",     # architecture mandates package names such as analysis.secrets and eval
  "D105", "D107",
  "PLR0913",  # argument count is reviewed by humans, not by a fixed number
  "PLR2004",
  "S603",     # subprocess without shell is our engine-adapter model (ADR-0002); S602 and S604 to S607 stay on
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "D", "PLR2004", "N802"]
"tools/**" = ["T20", "D"]            # project tooling (ARCHITECTURE section 3): stand-alone scripts may print
"src/codekavach/cli/**" = ["B008"]   # Typer uses function calls as argument defaults

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["codekavach"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
# Code blocks in Markdown are illustrative and docs/ARCHITECTURE.md is normative;
# the formatter must not rewrite them.
exclude = ["*.md"]
