<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeKavach · dashboard prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=Noto+Sans+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:inherit}
/* CodeKavach design tokens and components. Light, flat, minimal. */
.ck{
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#FAFBFC;--surface-3:#F0F2F5;--border:#E4E7EC;--border-strong:#D0D5DD;
  --text:#101828;--muted:#475467;--faint:#667085;
  --accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-soft:#EEF3FF;--accent-line:#B9CCF7;
  --crit:#D92D20;--high:#F97316;--med:#EAB308;--low:#60A5FA;--info:#98A2B3;
  --crit-t:#B42318;--high-t:#C4320A;--med-t:#854A0E;--low-t:#175CD3;--info-t:#475467;
  --crit-bg:#FEF3F2;--high-bg:#FFF4ED;--med-bg:#FEFBE8;--low-bg:#EFF6FF;--info-bg:#F2F4F7;
  --priv:#344054;--priv-bg:#F2F4F7;
  --ok:#12B76A;--ok-t:#067647;--ok-bg:#ECFDF3;--warn:#DC6803;--warn-bg:#FFFAEB;--bad:#D92D20;--bad-bg:#FEF3F2;
  --redact:#B42318;--redact-bg:#FEE4E2;--rename:#175CD3;--rename-bg:#E8F0FE;
  --code-bg:#FBFBFC;--syn-k:#1F2937;--syn-s:#116329;--syn-c:#6E7781;--syn-f:#953800;--syn-n:#0A3069;
  --shadow:none;
  background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.ck *{box-sizing:border-box}
.ck h1,.ck h2,.ck h3,.ck h4,.ck p{margin:0}
.ck a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- App shell ---------- */
.app{display:flex;flex-wrap:wrap;align-items:stretch}
.side{flex:1 1 228px;max-width:236px;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px 18px;display:flex;flex-direction:column;gap:1px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;text-decoration:none}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.005em;line-height:1.1}
.brand-sub{font-family:"Noto Sans Devanagari","IBM Plex Sans",sans-serif;font-size:11px;color:var(--faint);line-height:1.2}
.logo{width:26px;height:26px;flex:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:34px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a.on{background:var(--surface-3);color:var(--text);font-weight:600}
.nav a.subnav{padding-left:36px;font-size:13px;min-height:30px}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:16px 10px 6px;font-weight:500}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:20px;height:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.top .grow{flex:1 1 20px}
.content{padding:24px 28px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
@media (max-width:760px){.side{max-width:none;border-right:0;border-bottom:1px solid var(--border)}.nav{flex-direction:row;flex-wrap:wrap}.nav a.subnav{padding-left:10px}.side-foot{display:none}.content{padding:16px}.top{padding:10px 16px}}

/* ---------- Pills, chips, badges ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text);text-decoration:none}
.pill.priv .ico{color:var(--muted)}
.pill.off .dot{background:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--info);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--accent)}
.search{flex:1 1 220px;max-width:360px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--faint);font-size:13px}
.search span.grow{flex:1}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--border-strong);border-radius:4px;padding:0 5px;color:var(--muted);line-height:18px;background:var(--surface)}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn .badge-n{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--crit);font-size:0;overflow:hidden}
.user{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 2px;height:36px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);flex:none}
.role{font-size:11px;color:var(--faint)}

.sev{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text)}
.sev::before{content:"";width:8px;height:8px;flex:none}
.sev.c::before{background:var(--crit);transform:rotate(45deg) scale(.85)}
.sev.h::before{background:var(--high)}
.sev.m::before{background:var(--med);border-radius:50%}
.sev.l::before{border:2px solid var(--low);border-radius:50%}
.sev.i::before{height:2px;background:var(--info)}

.lvl{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:500;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);white-space:nowrap}
.lvl .ico{width:13px;height:13px;color:var(--muted)}
.meter{display:inline-flex;gap:2px;align-items:center}
.meter i{width:3px;height:10px;background:var(--border-strong);display:block}
.meter i.f{background:var(--text)}

.vd{display:inline-flex;align-items:center;gap:6px;height:22px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text)}
.vd::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--info)}
.vd.conf::before{background:var(--crit)}
.vd.like::before{background:var(--high)}
.vd.rev::before{background:transparent;border:1.5px solid var(--low-t)}
.vd.fp{color:var(--faint);text-decoration:line-through}
.vd .ico{display:none}

.cvss{display:inline-flex;align-items:center;height:22px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;gap:6px}
.cvss b{padding:0 5px;height:20px;display:grid;place-items:center;border-radius:3px;font-weight:600;color:#fff}
.cvss span{color:var(--faint);font-weight:400}
.cvss.c b{background:var(--crit)}.cvss.h b{background:var(--high);color:#1A0B00}.cvss.m b{background:var(--med);color:#1A1400}.cvss.l b{background:var(--low);color:#04172E}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted);background:var(--surface);font-family:"IBM Plex Mono",monospace;font-size:11.5px;white-space:nowrap;text-decoration:none}
a.tag:hover{color:var(--accent);border-color:var(--accent-line)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);white-space:nowrap}
.chip.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.new{color:var(--accent);border-color:var(--accent-line)}
.chip.fixed{color:var(--ok-t);border-color:#ABEFC6;background:var(--ok-bg)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}

.guard{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;min-width:0}
.guard:last-child{border-bottom:0}
.guard .gid{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--text);font-size:12px;flex:none;width:24px}
.guard .gt{flex:1;min-width:0;color:var(--muted)}
.guard .chk{flex:none;font-size:12px;font-weight:500;color:var(--ok-t);display:inline-flex;align-items:center;gap:6px}
.guard .chk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

.hash{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:0 2px 0 6px;height:24px;border-radius:4px;background:var(--surface-3);color:var(--text);white-space:nowrap}
.hash button{appearance:none;border:0;background:transparent;color:var(--faint);width:22px;height:22px;display:grid;place-items:center;border-radius:3px;cursor:pointer;padding:0}
.hash button:hover{color:var(--text)}
.hash .ico{width:13px;height:13px}

/* ---------- Layout ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.crumb{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:4px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s6{gap:6px}.stack.s16{gap:16px}.stack.s20{gap:20px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.acc{color:var(--accent)}.okc{color:var(--ok-t)}.badc{color:var(--crit-t)}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.g{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.g-side-l{grid-template-columns:280px minmax(0,1fr);align-items:start}
@media (max-width:1100px){.g-side,.g-side-l{grid-template-columns:minmax(0,1fr)}}
.hr{height:1px;background:var(--border);border:0;margin:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;min-width:0}
.card.flat{background:var(--surface-2)}
.card h2,.card h3{font-size:14px;font-weight:600}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500}
.more{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--accent);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}

.kpi .k-l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:28px;font-weight:500;letter-spacing:-.02em;margin-top:6px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:13px;color:var(--faint);font-weight:400;letter-spacing:0}
.kpi .k-d{font-size:12px;color:var(--faint);margin-top:4px;display:flex;align-items:center;gap:4px}
.up{color:var(--crit-t)}.down{color:var(--ok-t)}
.spark{width:100%;height:28px;display:block;margin-top:10px;fill:none;stroke:var(--accent);stroke-width:1.5}

/* ---------- Buttons and forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:500 13px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface-3)}
.btn.danger{color:var(--crit-t);border-color:#FDA29B;background:var(--surface)}
.btn.xl{height:48px;padding:0 22px;font-size:15px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.inp{height:36px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 10px;font:13px "IBM Plex Sans",system-ui,sans-serif;width:100%;min-width:0}
.inp.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5}
.sw{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--text)}
.sw:checked::after{left:16px}
.chk{accent-color:var(--text);width:15px;height:15px;margin:0}
.swrow{display:flex;align-items:center;gap:10px;font-size:13px;min-height:30px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button,.seg a{appearance:none;border:0;border-right:1px solid var(--border);background:transparent;color:var(--muted);font:500 12.5px "IBM Plex Sans",system-ui,sans-serif;height:32px;padding:0 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.seg button:last-child,.seg a:last-child{border-right:0}
.seg .on{background:var(--surface-3);color:var(--text);font-weight:600}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button,.tabs a{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:0 10px;min-height:40px;color:var(--muted);font:500 13px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px}
.tabs .on{color:var(--text);border-bottom-color:var(--text)}
.tabs .cnt{font-size:11px;color:var(--faint)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.wrap{white-space:normal;min-width:240px}
.tbl .t-title{font-weight:500;color:var(--text);text-decoration:none}
.tbl a.t-title:hover{color:var(--accent);text-decoration:underline}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Code viewer ---------- */
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;line-height:21px;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;overflow-x:auto;padding:10px 0}
.code .ln{display:flex;white-space:pre;padding-right:16px;min-height:21px}
.code .n{width:48px;flex:none;text-align:right;padding-right:16px;color:#98A2B3;user-select:none}
.code .ln.hl{background:#F5F8FF}
.code .ln.src{background:var(--low-bg)}
.code .ln.sink{background:var(--crit-bg)}
.code .ln.out{opacity:.4}
.code .fold{display:flex;align-items:center;gap:8px;margin:4px 12px;padding:2px 10px;border-top:1px dashed var(--border-strong);border-bottom:1px dashed var(--border-strong);color:var(--faint);font-size:11.5px;white-space:nowrap}
.code-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);font-size:12.5px;flex-wrap:wrap}
.code-h + .code{border-radius:0 0 8px 8px}
.tk{color:var(--syn-k);font-weight:600}.ts{color:var(--syn-s)}.tc{color:var(--syn-c);font-style:italic}.tf{color:var(--syn-f)}.tn{color:var(--syn-n)}
.rd{background:var(--redact-bg);color:var(--redact);border-radius:3px;padding:0 3px;font-weight:500}
.rn{background:var(--rename-bg);color:var(--rename);border-radius:3px;padding:0 3px}
.gen{color:var(--faint);font-style:italic}
.diff-add{background:var(--ok-bg)}.diff-del{background:var(--bad-bg)}
.diff-add .n::after{content:" +";color:var(--ok-t)}.diff-del .n::after{content:" -";color:var(--crit-t)}

/* ---------- Notes, banners, toasts ---------- */
.note{border-top:1px solid var(--border);padding:12px 0 0;font-size:12.5px;color:var(--muted)}
.note.box{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--surface-2)}
.note b,.note strong{color:var(--text);font-weight:600}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:2px 0}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #ABEFC6;background:var(--ok-bg);font-size:13px;flex-wrap:wrap;color:var(--text)}
.banner.info{border-color:var(--border);background:var(--surface)}
.banner.warn{border-color:#FEDF89;background:var(--warn-bg)}
.banner.bad{border-color:#FDA29B;background:var(--bad-bg)}
.banner .ico{flex:none}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--text);color:#fff;font-size:13px;max-width:380px}
.toast .sub{color:#D0D5DD}

/* ---------- Data viz bits ---------- */
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.priv i{background:var(--text)}
.vbars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px;border-bottom:1px solid var(--border)}
.vbars .col{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;min-width:0}
.vbars .col i{display:block}
.xax{display:flex;gap:12px;font-size:11px;color:var(--faint);margin-top:6px}
.xax span{flex:1;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;display:inline-block}
.hm{display:grid;gap:2px}
.hm .c{height:30px;display:grid;place-items:center;font-size:11px;font-weight:500;font-family:"IBM Plex Mono",monospace}
.h0{background:var(--surface-3);color:var(--faint)}
.h1{background:#E4ECFD;color:var(--text)}
.h2{background:#BFD1F9;color:var(--text)}
.h3{background:#7D9FEF;color:#06163F}
.h4{background:#1D4ED8;color:#fff}
.rm{display:grid;grid-template-columns:24px repeat(5,minmax(0,1fr));gap:2px}
.rm .c{height:42px;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.rm .ax{font-size:11px;color:var(--faint);display:grid;place-items:center}
.r1{background:#F2F4F7;color:var(--info-t)}.r2{background:#E8F0FE;color:var(--low-t)}.r3{background:#FEF7C3;color:var(--med-t)}.r4{background:#FFE6D5;color:var(--high-t)}.r5{background:#FEE4E2;color:var(--crit-t)}
.donut{width:120px;height:120px;flex:none}

/* ---------- Pipeline ---------- */
.pipe-wrap{overflow-x:auto}
.pipe{display:grid;grid-template-columns:repeat(9,minmax(112px,1fr));gap:0;min-width:1060px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.stage{border-right:1px solid var(--border);padding:12px;font-size:12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.stage:last-child{border-right:0}
.stage .sn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.stage .st-t{font-weight:600;font-size:12.5px;line-height:1.3;color:var(--text)}
.stage .loc{font-size:11px;color:var(--faint)}
.stage .loc.rem{color:var(--high-t)}
.stage .cnt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.stage.done::after{background:var(--text)}
.stage.run::after{background:var(--accent)}
.stage.run .sn{color:var(--accent);font-weight:600}
.stage.wait{color:var(--faint)}
.stage.wait .st-t{color:var(--faint)}
.stage.guardz{background:var(--surface-2)}
.stand{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:0}
.stand .sn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.stand .st-t{font-weight:600;font-size:12.5px;line-height:1.3;color:var(--text)}

/* ---------- Taint path ---------- */
.taint{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.tnode{flex:1 0 180px;border:1px solid var(--border-strong);border-radius:6px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);min-width:180px}
.tnode:hover{border-color:var(--accent)}
.tnode .tk-l{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.tnode.src .tk-l{color:var(--low-t)}
.tnode.san{border-style:dashed}
.tnode.san .tk-l{color:var(--med-t)}
.tnode.sink{border-color:#FDA29B;background:var(--crit-bg)}
.tnode.sink .tk-l{color:var(--crit-t)}
.tnode .tl{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint)}
.tnode code{font-family:"IBM Plex Mono",monospace;font-size:12px}
.tedge{flex:0 0 34px;display:grid;place-items:center;color:var(--faint)}

/* ---------- Misc ---------- */
.skel{background:var(--surface-3);border-radius:3px;height:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
.empty .em-ico{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--faint)}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;font-size:13px}
.dl dt{color:var(--faint)}.dl dd{margin:0;min-width:0}
.steps{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.step{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;padding:10px 14px 10px 0;margin-right:18px;font:500 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--faint);cursor:pointer}
.step .sc{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint)}
.step.done{color:var(--muted)}
.step.on{border-bottom-color:var(--text);color:var(--text)}
.step.on .sc{color:var(--text)}
.lvlcard{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.lvlcard:hover{border-color:var(--border-strong)}
.lvlcard.on{border-color:var(--text);outline:1px solid var(--text)}
.console{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:20px;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;height:240px;overflow:auto;color:var(--muted)}
.console .t{color:#98A2B3}
.console .okl{color:var(--ok-t)}
.console .acl{color:var(--accent)}
.console .wl{color:var(--warn)}
.timeline{display:flex;flex-direction:column;gap:14px;position:relative}
.tl-i{display:flex;gap:10px;font-size:13px}
.tl-i .avatar{width:26px;height:26px;font-size:10px}
.provlogo{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface-2);flex:none}
.swatch{height:48px;border-radius:6px;border:1px solid var(--border)}
.page{background:#FFFFFF;color:#111827;border:1px solid var(--border);border-radius:4px;padding:36px 40px;font-size:12px;line-height:1.55}
.page h3{font-size:18px;font-weight:600;color:#0B1B33}
.page .pm{color:#4B5563}
.page table{width:100%;border-collapse:collapse;font-size:11px}
.page td,.page th{border:1px solid #D7DCE4;padding:5px 7px;text-align:left}
.page th{background:#F4F6F8}

<div class="ph"><div><div class="crumb"><span>CodeKavach</span><span>/</span><span>How it works</span></div><h1>How CodeKavach works</h1><p class="muted" style="margin-top: 4px; max-width: 760px">Heavy analysis stays on your machine. Only a minimal, sanitised slice crosses the boundary, every outbound byte is written to the egress ledger, and verdicts are mapped back using a vault that never leaves.</p></div><a class="btn pri" href="#DemoMode"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Run KavachBank demo</a></div>

<section class="card" style="padding: 24px">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 170px 230px; gap: 0; min-width: 0; overflow-x: auto">
<div style="grid-row: 1 / span 3; border: 1px solid var(--border-strong); border-radius: 14px 0 0 14px; padding: 18px; background: var(--surface-2); display: flex; flex-direction: column; gap: 14px; min-width: 520px">
<div class="row between"><span class="sec-h">Your machine · local</span><span class="xs faint">code, vault and ledger never leave</span></div>
<div class="row" style="gap: 8px; flex-wrap: nowrap">
<div class="stand" style="flex: 1"><span class="sn">01</span><span class="st-t">Ingest &amp; parse</span><span class="xs muted">ASTs, symbols, call graph</span></div>
<svg class="ico faint" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"></path></svg>
<div class="stand" style="flex: 1"><span class="sn">02</span><span class="st-t">Deterministic analysis</span><span class="xs muted">SAST, secrets, SCA, IaC, taint</span></div>
<svg class="ico faint" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"></path></svg>
<div class="stand" style="flex: 1"><span class="sn">03</span><span class="st-t">Candidate findings</span><span class="xs muted">source-to-sink paths, hits</span></div>
</div>
<div class="hr"></div>
<div class="row" style="gap: 8px; flex-wrap: nowrap">
<div class="stand" style="flex: 1"><span class="sn">09</span><span class="st-t">Issue sync</span><span class="xs muted">GitHub issues, Kanban</span></div>
<svg class="ico faint" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M10 7l-5 5 5 5"></path></svg>
<div class="stand" style="flex: 1"><span class="sn">08</span><span class="st-t">Audit report</span><span class="xs muted">PDF, DOCX, SARIF, JSON</span></div>
<svg class="ico faint" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M10 7l-5 5 5 5"></path></svg>
<div class="stand" style="flex: 1"><span class="sn">07</span><span class="st-t">Risk rating</span><span class="xs muted">CWE, OWASP, CVSS 4.0</span></div>
</div>
<div class="row" style="gap: 10px"><span class="chip"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Vault · pseudonym map</span><span class="chip"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Egress ledger · hash-chained</span></div>
</div>
<div style="grid-row: 1 / span 3; background: var(--priv-bg); border-top: 1px solid var(--priv); border-bottom: 1px solid var(--priv); padding: 18px 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; text-align: center; position: relative">
<span class="sec-h">Boundary</span>
<div><div class="sn mono xs" style="color: var(--priv)">04 · OUTBOUND</div><div style="font-weight: 650">Privacy layer</div><div class="xs muted">redact → slice → pseudonymise → leak check → ledger</div></div>
<div class="xs" style="color: var(--priv); font-weight: 600; letter-spacing: 0.06em">THE ARMOUR</div>
<div><div class="sn mono xs" style="color: var(--priv)">06 · INBOUND</div><div style="font-weight: 650">De-pseudonymise</div><div class="xs muted">verdicts mapped back from the local vault</div></div>
</div>
<div style="grid-row: 1 / span 3; border: 1px dashed var(--border-strong); border-radius: 0 8px 8px 0; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface)">
<span class="sec-h" style="color: var(--high)">Remote · or self-hosted</span>
<div class="stand"><span class="sn">05</span><span class="st-t">LLM reasoning</span><span class="xs muted">Claude, OpenAI, Gemini, Grok, Bedrock, Azure, or Qwen, DeepSeek, Llama via Ollama / vLLM</span></div>
<div class="xs muted">Receives only the sanitised slice. Returns a verdict, rationale and exploit scenario in pseudonyms.</div>
<div class="note xs" style="background: transparent">At <b>L0</b> this column is empty: a local model or deterministic engines only.</div>
</div>
</div>
</section>

<section class="g g-3">
<div class="card stack"><h3>What crosses the boundary</h3><p class="sub">At the default L3: the minimal vulnerability-relevant slice, with secrets and PII redacted and identifiers, strings and comments pseudonymised. No whole files.</p><a class="btn sm" href="#PrivacyInspect" style="align-self: flex-start">Open Privacy Inspect</a></div>
<div class="card stack"><h3>How it is measured</h3><p class="sub">Every payload is hashed, checked against the listed-term set and appended to a hash-chained ledger. The chain can be verified offline at any time.</p><a class="btn sm" href="#EgressLedger" style="align-self: flex-start">Open Egress Ledger</a></div>
<div class="note"><b>What this does not cover.</b><ul><li>Control flow, literal shapes and public API names stay visible at L2 and L3.</li><li>The leak check is verbatim only; paraphrase or encoding is out of scope.</li><li>CodeKavach measures disclosure. It does not claim zero disclosure.</li></ul></div>
</section>
</main>

<div><h3 style="font-size: 13px; margin-bottom: 4px">Rationale</h3><p class="sm muted">Two request parameters reach the query through f-string interpolation with no parameter binding. The value bound to <span class="rn">v_3a91</span> (restored locally: <b>month</b>) is placed inside quotes and can break out of them. The value for <span class="rn">v_0d55</span> (<b>sort_by</b>) is placed after ORDER BY with no allow-list, so it can inject a sub-query even if the other values were quoted safely.</p></div>
<div><h3 style="font-size: 13px; margin-bottom: 4px">Exploit scenario</h3><p class="sm muted">An authenticated customer requests <span class="mono">/statements/&lt;own id&gt;?month=2026-10' OR '1'='1</span> and receives ledger entries for every account. Through sort_by a boolean-based blind query can read other tables.</p></div>

</tbody></table></div>

<div class="card stack">
<h2>Impact</h2>
<p class="sm muted">Any signed-in customer can read statement lines belonging to other customers, including narration text that often contains counterparty names and UPI references. The same connection user has write access to <span class="mono">ledger_entries</span>, so stacked queries could alter balances where the driver allows them.</p>
</div>

<div class="card stack">
<div class="row between"><h2>Remediation</h2><span class="xs faint">Suggested fix · review before applying</span></div>
<p class="sm muted">Bind <b>account_id</b> and <b>month</b> as parameters. Allow-list <b>sort_by</b> because column names cannot be bound.</p>
<div class="code-h"><span class="mono">app/statements/repository.py</span><span class="faint">+5 −4</span></div>
<div class="code">
<div class="ln"><span class="n">57</span>    order = sort_by <span class="tk">or</span> <span class="ts">"posted_at"</span></div>
<div class="ln diff-add"><span class="n">58</span>    order = order <span class="tk">if</span> order <span class="tk">in</span> ALLOWED_SORT <span class="tk">else</span> <span class="ts">"posted_at"</span></div>
<div class="ln diff-del"><span class="n">58</span>    sql = (<span class="ts">"SELECT posted_at, narration, amount FROM ledger_entries "</span></div>
<div class="ln diff-del"><span class="n">59</span>           <span class="ts">f"WHERE account_id = '{account_id}' AND stmt_month = '{month}' "</span></div>
<div class="ln diff-del"><span class="n">60</span>           <span class="ts">f"ORDER BY {order}"</span>)</div>
<div class="ln diff-del"><span class="n">61</span>    cursor.execute(sql)</div>
<div class="ln diff-add"><span class="n">59</span>    sql = (<span class="ts">"SELECT posted_at, narration, amount FROM ledger_entries "</span></div>
<div class="ln diff-add"><span class="n">60</span>           <span class="ts">"WHERE account_id = %s AND stmt_month = %s "</span></div>
<div class="ln diff-add"><span class="n">61</span>           <span class="ts">f"ORDER BY {order}"</span>)</div>
<div class="ln diff-add"><span class="n">62</span>    cursor.execute(sql, (account_id, validate_month(month)))</div>
</div>
</div>

class DCLogic {
  constructor(){ this.props = {}; this.state = {}; }
  setState(p){ Object.assign(this.state, p); render(); }
}
const REG = {};
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(v, p){
  p = p.trim();
  if (p === 'true') return true; if (p === 'false') return false;
  return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), v);
}
function interp(s, v){ return s.replace(HOLE, (_, p) => { const r = look(v, p); return r == null ? '' : String(r); }); }
function walk(node, v){
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === 3) { if (child.nodeValue.includes('{{')) child.nodeValue = interp(child.nodeValue, v); continue; }
    if (child.nodeType !== 1) continue;
    if (child.tagName === 'SC-IF') {
      const m = /\{\{\s*([^}]+?)\s*\}\}/.exec(child.getAttribute('value') || '');
      if (m && look(v, m[1])) { walk(child, v); child.replaceWith(...Array.from(child.childNodes)); }
      else child.remove();
      continue;
    }
    for (const a of Array.from(child.attributes)) {
      if (!a.value.includes('{{')) continue;
      const whole = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(a.value);
      if (a.name.startsWith('on') && whole) {
        const fn = look(v, whole[1]); child.removeAttribute(a.name);
        if (typeof fn === 'function') child.addEventListener(a.name.slice(2), e => { e.preventDefault(); fn(e); });
      } else if (a.name.startsWith('hint-')) { child.removeAttribute(a.name); }
      else child.setAttribute(a.name, interp(a.value, v));
    }
    walk(child, v);
  }
}
const inst = {};
let current = null;
function render(){
  const tpl = document.getElementById('tpl-' + current);
  const holder = document.createElement('template');
  holder.innerHTML = tpl.innerHTML;
  inst[current] = inst[current] || new REG[current]();
  walk(holder.content, inst[current].renderVals());
  const app = document.getElementById('app');
  app.replaceChildren(holder.content);
}
function go(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  if (!REG[h]) { const el = document.getElementById(h); if (el) el.scrollIntoView(); return; }
  current = h; render(); window.scrollTo(0, 0);
  document.getElementById('jump').value = h;
}
window.addEventListener('hashchange', go);
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('jump').addEventListener('change', e => { location.hash = e.target.value; });
  if (!location.hash || !REG[location.hash.slice(1)]) location.hash = 'Overview'; else go();
});

class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const s = st.step || 3;
    const lv = st.lvl || 'L3';
    const c = (n) => (n < s ? 'done' : (n === s ? 'on' : ''));
    const go = (n) => () => this.setState({ step: n });
    const pick = (l) => () => this.setState({ lvl: l });
    const info = {
      L0: ['L0 · Local only', 'Nothing. No network connection is opened.', 'All code, secrets, identifiers and comments.\nVault and ledger.'],
      L1: ['L1 · Redacted', 'Source files with secrets and PII replaced by typed placeholders.\nReal identifiers, strings and comments.', 'Secret values and PII.\nVault and ledger.'],
      L2: ['L2 · Pseudonymised', 'Source files with identifiers, strings and comments pseudonymised.\nControl flow and literal shapes.', 'Secrets, PII, real names and business terms.\nVault mapping pseudonyms back.'],
      L3: ['L3 · Minimal slice', 'Only the lines on the source-to-sink slice, pseudonymised.\nControl flow and public API names in that slice.', 'Whole files, secrets, PII, real names and business terms.\nEverything outside the slice.'],
      L4: ['L4 · Facts only', 'Abstract data-flow facts and questions. No code.', 'All source code, names and literals.\nVault and ledger.']
    };
    const k = (l) => (lv === l ? 'on' : '');
    return {
      theme: 'light',
      s1: s === 1, s2: s === 2, s3: s === 3, s4: s === 4, s5: s === 5,
      c1: c(1), c2: c(2), c3: c(3), c4: c(4), c5: c(5),
      go1: go(1), go2: go(2), go3: go(3), go4: go(4), go5: go(5),
      next: () => this.setState({ step: Math.min(5, s + 1) }),
      back: () => this.setState({ step: Math.max(1, s - 1) }),
      notLast: s < 5, isLast: s === 5,
      stepLabel: 'Step ' + s + ' of 5',
      k0: k('L0'), k1: k('L1'), k2: k('L2'), k3: k('L3'), k4: k('L4'),
      p0: pick('L0'), p1: pick('L1'), p2: pick('L2'), p3: pick('L3'), p4: pick('L4'),
      lvlPill: info[lv][0], lvlName: lv, leaves: info[lv][1], stays: info[lv][2]
    };
  }
}

 return Component; })();
