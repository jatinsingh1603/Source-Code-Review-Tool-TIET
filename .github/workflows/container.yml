name: Container

# Builds deploy/docker/Dockerfile and publishes ghcr.io/jatinsingh1603/codekavach.
#   push to main : tags main and sha-<short>
#   push of v*   : tags <version>, <major>.<minor> and latest
#   manual run   : workflow_dispatch builds and (by default) pushes like a main push
# The image never contains a secret; the LLM key is supplied at run time by the operator.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "ui/**"
      - "rules/**"
      - "data/**"
      - "docs/schemas/**"
      - "fixtures/kavachbank/**"
      - "deploy/docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (false = build only)
        type: boolean
        default: true
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  # One group per commit: main moves constantly and a shared group would drop queued builds, so
  # an image for a given commit would never be published.
  group: container-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jatinsingh1603/codekavach

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=CodeKavach
            org.opencontainers.image.description=Privacy-preserving, LLM-assisted secure source code review

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
