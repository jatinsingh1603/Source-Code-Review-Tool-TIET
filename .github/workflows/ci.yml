name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Direct pushes to main are never cancelled: each commit needs its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYPOTHESIS_PROFILE: ci
  CODEKAVACH_PERF_FACTOR: "3.0"
  DO_NOT_TRACK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the schema compatibility gate reads the pushed range
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: make lock-check fmt-check lint changelog-check telemetry-check
        env:
          UV_NO_SYNC: "1"
      - name: Documentation check (links, anchors, style, ADR index)
        run: make docs-check
        env:
          UV_NO_SYNC: "1"
      - name: Schema drift check
        run: uv run python -m codekavach.core.models.export --check --check-migrations
        env:
          UV_NO_SYNC: "1"
      - name: Schema examples check
        run: uv run python tools/schemas/build_examples.py --check
        env:
          UV_NO_SYNC: "1"
      - name: Command-line reference check
        run: uv run python tools/gen_cli_docs.py --check
        env:
          UV_NO_SYNC: "1"
      - name: Schema compatibility
        # Compares the whole push with the commit main pointed at before it (E02-24); a breaking
        # schema change needs a SCHEMA_VERSION bump and a migration step.
        if: github.event_name == 'push'
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          uv run python -m codekavach.core.models.export --compat-base "$base"
        env:
          UV_NO_SYNC: "1"
          BEFORE: ${{ github.event.before }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: make type
        env:
          UV_NO_SYNC: "1"

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: make contracts
        env:
          UV_NO_SYNC: "1"

  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --locked --all-extras
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          UV_NO_SYNC: "1"

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Event data reaches the script through the environment, not through the command line.
      - name: Commit message convention (AGENTS.md section 5)
        run: python3 tools/dev/check_commit_msg.py --ci
        env:
          COMMIT_CHECK_EVENT: ${{ github.event_name }}
          COMMIT_CHECK_BEFORE: ${{ github.event.before }}
          COMMIT_CHECK_SHA: ${{ github.sha }}
          COMMIT_CHECK_BASE_REF: ${{ github.base_ref }}

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Issue #313: the Linux job ran every test, the perf budgets and branch coverage in one process
    # (14.5 minutes at 6 500 tests). The tests now run on every core with pytest-xdist
    # (pytest-cov merges the workers' coverage data, so the total and the 85 % gate are unchanged)
    # and the perf budgets moved to the perf job below, which has no parallel workers.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: uv run python --version
        env:
          UV_NO_SYNC: "1"
      - name: Tests with coverage on every core (the perf budgets run in the perf job)
        run: make cov
        env:
          UV_NO_SYNC: "1"
          PYTEST_ARGS: >-
            -n auto --dist worksteal -m "not network and not perf" --durations=30
            --junitxml=junit-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Coverage total in the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          UV_NO_SYNC: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: junit-${{ matrix.os }}-${{ matrix.python }}.xml
          retention-days: 14
          if-no-files-found: ignore

  perf:
    # The performance budgets (marker perf) on an unloaded runner: one process, no xdist workers,
    # no coverage tracing (see docs/process/testing.md). Linux only, as before.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Performance budgets without coverage
        run: make perf
        env:
          UV_NO_SYNC: "1"
          PYTEST_ARGS: --durations=10

  ui:
    # The web dashboard (ui/, React + Vite): install from the lock file, type-check and build,
    # then run the unit tests. Skipped (and green) while ui/package.json does not exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the dashboard
        id: present
        run: |
          if [ -f ui/package.json ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; echo "no ui/package.json; nothing to build"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.present.outputs.ui == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (npm ci)
        if: steps.present.outputs.ui == 'true'
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Build (npm run build)
        if: steps.present.outputs.ui == 'true'
        working-directory: ui
        run: npm run build
      - name: Unit tests (npm test)
        if: steps.present.outputs.ui == 'true'
        working-directory: ui
        run: npm test

  docker:
    # Smoke build of the server image (build only, never pushed; the Container workflow publishes).
    # Skipped (and green) while no Dockerfile exists.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the Dockerfile
        id: present
        run: |
          for f in deploy/docker/Dockerfile Dockerfile; do
            if [ -f "$f" ]; then echo "dockerfile=$f" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "no Dockerfile; nothing to build"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.present.outputs.dockerfile != ''
      - name: Build the image (linux/amd64, no push)
        if: steps.present.outputs.dockerfile != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.present.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: codekavach:ci-smoke
          cache-from: type=gha,scope=ci-smoke
          cache-to: type=gha,scope=ci-smoke,mode=max

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: make build
        env:
          UV_NO_SYNC: "1"
      - name: Check wheel contents
        run: |
          python3 -m zipfile -l dist/*.whl | tee wheel-contents.txt
          if grep -qE '(^|/)tests/' wheel-contents.txt; then echo "wheel contains tests/"; exit 1; fi
          grep -q 'codekavach/py.typed' wheel-contents.txt || { echo "wheel lacks py.typed"; exit 1; }
          for f in env.py script.py.mako versions/0001_initial.py; do
            grep -q "codekavach/core/store/migrations/$f" wheel-contents.txt || { echo "wheel lacks migrations/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Dependency licence gate (runtime strict, dev tools listed)
        run: |
          make licences
          uv run python tools/dev/check_licences.py --include-dev --format json > licences.json
        env:
          UV_NO_SYNC: "1"

  demo:
    # Demo 1 end to end on the mock provider (E13-03): the run fails when a listed term occurs in a
    # ledger payload, when the ledger does not verify, or when the PDF report cannot be made.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Libraries WeasyPrint needs for the PDF report
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --locked --all-extras
      - name: Run the demo (budget 3 minutes)
        run: |
          timeout 180 uv run codekavach demo --out demo-out | tee demo-out.txt
          test -s demo-out/report.pdf || { echo "the PDF report was not written"; exit 1; }
        env:
          UV_NO_SYNC: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: demo-output
          path: |
            demo-out/inspect.html
            demo-out/report.html
            demo-out/report.pdf
            demo-out/verification.txt
            demo-out.txt
          retention-days: 14
          if-no-files-found: ignore

  detector-eval:
    # Detector accuracy on the in-repository labelled corpus (E08-04). Fails when the recall of
    # any HIGH-confidence subtype is below 1.0; the table is kept as a build artefact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Score the detectors
        run: |
          uv run python tools/detector_eval.py --check --out-dir detector-eval
          cat detector-eval/report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          UV_NO_SYNC: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: detector-eval
          path: |
            detector-eval/report.md
            detector-eval/report.json
          retention-days: 30
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [lint, typecheck, contracts, hooks, commits, test, perf, ui, docker, build, licences, demo, detector-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r=json.load(sys.stdin); bad=[k for k,v in r.items() if v['result']!='success']; print('failed:', bad); sys.exit(1 if bad else 0)"
