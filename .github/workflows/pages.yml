name: Pages

# Publishes the dashboard (ui/) in its mock mode to GitHub Pages:
# https://jatinsingh1603.github.io/Source-Code-Review-Tool-TIET/
# Mock mode answers every API call in the browser from synthetic fixture data
# (ui/src/mock); the site has no server, no LLM key and no secret.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Node as the CI ui job (ui/package.json sets no engines and there is no .nvmrc).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (npm ci)
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Build the mock-mode dashboard for the Pages sub-path
        working-directory: ui
        env:
          VITE_MOCK: "1"
          VITE_BASE: /Source-Code-Review-Tool-TIET/
        run: npm run build
      - name: Serve deep links and skip Jekyll
        working-directory: ui
        # Pages answers an unknown path with 404.html, so /…/findings loads the app on refresh.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ui/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
