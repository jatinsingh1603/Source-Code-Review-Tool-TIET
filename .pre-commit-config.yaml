# Local last line of defence before a commit reaches main; CI runs the same hooks (E01-18).
# Never bypass them with --no-verify. Third-party hooks are pinned to release tags.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(fixtures/|tests/.*/golden/|tests/fixtures/)
      - id: trailing-whitespace
        # Issue templates keep "- [ ] " and "Blocked by: " as fill-in prompts.
        exclude: ^(fixtures/|tests/.*/golden/|tests/fixtures/|\.github/ISSUE_TEMPLATE/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(fixtures/|tests/.*/golden/|tests/fixtures/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-executables-have-shebangs
      - id: detect-private-key
        exclude: ^(fixtures/|tests/.*/golden/|tests/fixtures/)
      - id: debug-statements
        exclude: ^(fixtures/|tests/.*/golden/|tests/fixtures/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # docs/schemas/index.json holds generated SHA-256 digests of the schema files; it is
        # verified byte for byte by the schema drift check instead. The config show and starter
        # goldens are byte-exact renderer output: the engine switch "secrets = true" and the
        # reference placeholders (api_key = "env:...") trip the keyword detector, and
        # test_config_show.py and test_starter.py assert that no secret value is ever rendered.
        # snapshot_demo.json holds the settings fingerprint, a SHA-256 in hex by design.
        # docs/schemas/examples/ are generated from the synthetic factories (payload and ledger
        # hashes in hex) and checked byte for byte by tools/schemas/build_examples.py --check.
        # Two JSON fixtures of the E08-02 secret-detector corpus cannot carry a pragma comment: a
        # Google service-account key file (a marker that expands to synthetic JSON) and a
        # package-lock integrity digest (a negative case). Every other corpus file allowlists
        # its lines inline, and every planted value is listed in manifest.json. The KavachBank
        # fixture (E13-01) plants synthetic credentials and identifiers on purpose; every one is
        # listed in fixtures/kavachbank/ground-truth/manifest.yaml and resolved against
        # tests/support/synthetic.py by tests/integration/test_kavachbank_fixture.py. The Bandit
        # conformance case (E15-01) is Bandit's own JSON report, whose hard-coded password message
        # quotes a synthetic placeholder; JSON cannot carry a pragma and the file is replayed as is.
        exclude: ^(fixtures/kavachbank/.*|uv\.lock|docs/schemas/index\.json|docs/schemas/examples/.*|tests/golden/config/(show_effective(_origin)?|starter_full|starter_profile_demo)\.toml|tests/golden/config/snapshot_demo\.json|tests/fixtures/detect/secrets/(positive/gcp_service_account_json|negative/lock_sri)\.txt|tests/fixtures/engines/bandit/basic/output\.json)$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project environment)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-contracts
        name: import contracts (lint-imports)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|\.importlinter$)
      - id: codekavach-schema-drift
        name: schema drift and migration completeness (E02-23)
        entry: uv run python -m codekavach.core.models.export --check --check-migrations
        language: system
        pass_filenames: false
        files: ^(src/codekavach/core/models/|docs/schemas/)
      - id: codekavach-schema-examples
        name: schema example documents (E02-29)
        entry: uv run python tools/schemas/build_examples.py --check
        language: system
        pass_filenames: false
        files: ^(src/codekavach/core/models/|docs/schemas/|tests/support/factories\.py|tools/schemas/)
      - id: codekavach-cli-reference
        name: command-line reference (E05-29)
        entry: uv run python tools/gen_cli_docs.py --check
        language: system
        pass_filenames: false
        files: ^(src/codekavach/cli/|tools/gen_cli_docs\.py|docs/reference/cli\.md)
      - id: kavachbank-terms-drift
        name: KavachBank terms file drift (E13-01)
        entry: uv run python tools/gen_terms.py --check
        language: system
        pass_filenames: false
        files: ^(fixtures/kavachbank/ground-truth/|tools/gen_terms\.py|tests/support/(kavachbank|synthetic)\.py)
      - id: docs-check
        name: documentation check (links, anchors, style)
        entry: uv run python tools/dev/check_docs.py
        language: system
        files: \.md$
      - id: commit-msg-format
        name: commit message convention (AGENTS.md section 5)
        entry: uv run python tools/dev/check_commit_msg.py
        language: system
        stages: [commit-msg]
      - id: forbid-runtime-artefacts
        name: forbid runtime artefacts and local secrets
        entry: uv run python tools/dev/forbid_runtime_artefacts.py
        language: system
