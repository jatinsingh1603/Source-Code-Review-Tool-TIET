  data/cwe/catalogue.yaml: [cwe, cwe-top25-2024, capec, owasp-top10-2021, owasp-asvs-4.0.3]
  data/cwe/families.yaml: [cvss-v4.0, cvss-v3.1, owasp-risk-rating, owasp-cheat-sheets]
